<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platební údaje</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #f9fafb; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
    .card { background: white; padding: 28px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); max-width: 400px; width: 100%; text-align: center; }
    h2 { margin-top: 0; color: #111827; }
    .details { background: #f3f4f6; padding: 16px; border-radius: 8px; text-align: left; margin: 16px 0; line-height: 1.8; color: #1f2937; }
    img { max-width: 260px; width: 100%; height: auto; border: 1px solid #e5e7eb; border-radius: 8px; margin-top: 8px; }
    .note { font-size: 0.85rem; color: #6b7280; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Děkujeme za registraci!</h2>
    <p>Vstupenky uhradíte naskenováním QR kódu ve vaší bankovní aplikaci nebo převodem:</p>
    <div class="details">
      <strong>Číslo účtu:</strong> <span id="acc-text">3802085003/5500</span><br>
      <strong>Částka:</strong> <span id="amount-text">--</span> Kč<br>
      <strong>Variabilní symbol:</strong> <span id="vs-text">--</span><br>
      <strong>Zpráva pro příjemce:</strong> <span id="msg-text">Vstupenky ples</span>
    </div>
    <img id="qr-img" alt="Načítání QR kódu..." />
    <p class="note">Po připsání platby na účet vám na e-mail dorazí potvrzení.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const amount = params.get('amount') || '0';
    const vs = params.get('vs') || '';
    const acc = params.get('acc') || '3802085003';
    const bank = params.get('bank') || '5500';
    const name = params.get('name') || '';

    // Supports either ?msg=Vstupenky+ples+Jmeno (from Apps Script) or ?name=Jmeno directly
    const rawMsg = params.get('msg') || (name ? `Vstupenky ples ${name}` : 'Vstupenky ples');
    const safeQrMsg = rawMsg
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .slice(0, 60);

    document.getElementById('acc-text').textContent = `${acc}/${bank}`;
    document.getElementById('amount-text').textContent = amount;
    document.getElementById('vs-text').textContent = vs;
    document.getElementById('msg-text').textContent = rawMsg;
    document.getElementById('qr-img').src = `https://api.paylibo.com/paylibo/generator/czech/image?accountNumber=${encodeURIComponent(acc)}&bankCode=${encodeURIComponent(bank)}&amount=${encodeURIComponent(amount)}&currency=CZK&vs=${encodeURIComponent(vs)}&message=${encodeURIComponent(safeQrMsg)}&size=400`;
  </script>
</body>
</html>
